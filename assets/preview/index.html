<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character preview</title>
  <link rel="stylesheet" href="preview.css">
  <script defer src="pixelfx.js"></script>
  <script defer src="character-data.js"></script>
  <script defer src="preview.js"></script>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <div class="workspace">
      <div class="stage"><canvas id="stage"></canvas></div>
      <aside class="controls">
        <div id="clips" role="group"></div>
        <div class="playback">
          <button type="button" id="play" class="primary" disabled>Play</button>
          <select id="speed"><option value="1">1×</option><option value=".5">0.5×</option></select>
        </div>
        <div class="stepper">
          <button type="button" id="prev" disabled>←</button>
          <span><strong id="phase"></strong><small id="count"></small></span>
          <button type="button" id="next" disabled>→</button>
        </div>
        <p class="grip" id="status" role="status"></p>
        <div class="options">
          <label><input id="loop" type="checkbox"><span data-label="loop"></span></label>
          <label><input id="effects" type="checkbox" checked><span data-label="effects"></span></label>
          <label><input id="grips" type="checkbox"><span data-label="grips"></span></label>
        </div>
      </aside>
    </div>
    <footer>
      <a href="character.piskel" download data-label="piskel">Piskel</a>
      <a href="sprites.png" download data-label="atlas">Sprite sheet</a>
      <a href="actions.json" download data-label="data">Action data</a>
      <a href="contact-sheet.png" data-label="contact">Frame contact sheet</a>
    </footer>
  </main>
</body>
</html>
